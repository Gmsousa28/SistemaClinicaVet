  <header class="header-admin">

    <h1>Marcações</h1>

    <p>Gestão de agenda clínica e consultas</p>

  </header>

  <main class="dashboard-main">

    <h2 class="titulo-seccao">
      Lista de Marcações
    </h2>

    <div class="tabela-container">

      <table class="tabela-consultas">

        <thead>

          <tr>

            <th>ID Consulta</th>

            <th>ID Animal</th>

            <th>Data</th>

            <th>Hora</th>

            <th>Tipo</th>

            <th>Estado</th>

            <th>Ações</th>

          </tr>

        </thead>

        <tbody id="tabelaMarcacoes">
        </tbody>

      </table>

    </div>

  </main>

  <!-- MODAL -->
  <div id="modalEdicao" class="modal-edicao">

    <div class="cartao-formulario">

      <button
        class="fechar-modal"
        onclick="fecharModalEdicao()"
      >
        &times;
      </button>

      <h2 class="titulo-edicao">
        Editar Marcação
      </h2>

      <form onsubmit="event.preventDefault(); salvarEdicao();">

        <div class="grid-marcacoes">

          <!-- CAMPO ANIMAL BONITO -->
          <div class="campo-completo campo-animal">

            <label>
              Animal / Paciente:
            </label>

            <div class="input-animal-bonito">

              <div class="animal-icon">

                <i class="fa fa-paw"></i>

              </div>

              <div class="animal-info">

                <span class="animal-label">
                  Paciente
                </span>

                <input
                  type="text"
                  id="editNome"
                  readonly
                >

              </div>

            </div>

          </div>

          <div class="campo-completo">

            <label>
              Serviços:
            </label>

            <div class="container-servicos">

              <label class="botao-servico">

                <input
                  type="checkbox"
                  name="servico"
                  value="Consulta"
                  onchange="calcularHoraFim()"
                >

                <i class="fa fa-stethoscope"></i>

                Consulta Geral

              </label>

              <label class="botao-servico">

                <input
                  type="checkbox"
                  name="servico"
                  value="Banho"
                  onchange="calcularHoraFim()"
                >

                <i class="fa fa-bath"></i>

                Banho

              </label>

              <label class="botao-servico">

                <input
                  type="checkbox"
                  name="servico"
                  value="Tosquia"
                  onchange="calcularHoraFim()"
                >

                <i class="fa fa-cut"></i>

                Tosquia

              </label>

            </div>

          </div>

          <div class="grupo-input">

            <label>
              Data:
            </label>

            <input
              type="date"
              id="editDataMarcacao"
              class="input-premium"
            >

          </div>

          <div class="grupo-input">

            <label>
              Hora Início:
            </label>

            <select
              id="editHoraMarcacao"
              class="input-premium"
              onchange="calcularHoraFim()"
            >

              <option value="">
                Escolha a hora
              </option>

              <option value="09:00">09:00</option>
              <option value="09:30">09:30</option>
              <option value="10:00">10:00</option>
              <option value="10:30">10:30</option>
              <option value="11:00">11:00</option>
              <option value="11:30">11:30</option>
              <option value="12:00">12:00</option>
              <option value="12:30">12:30</option>
              <option value="13:00">13:00</option>
              <option value="13:30">13:30</option>
              <option value="14:00">14:00</option>
              <option value="14:30">14:30</option>
              <option value="15:00">15:00</option>
              <option value="15:30">15:30</option>
              <option value="16:00">16:00</option>
              <option value="16:30">16:30</option>
              <option value="17:00">17:00</option>

            </select>

          </div>

          <div class="grupo-input">

            <label class="label-hora-fim">
              Hora Fim:
            </label>

            <input
              type="time"
              id="editHoraFim"
              class="input-premium input-hora-fim"
              readonly
            >

          </div>

        </div>

        <div class="container-botoes-modal">

          <button
            type="button"
            onclick="fecharModalEdicao()"
            class="btn-cancelar"
          >
            Cancelar
          </button>

          <button
            type="submit"
            class="btn-salvar"
          >
            <i class="fa fa-save"></i>

            Guardar
          </button>

        </div>

      </form>

    </div>

  </div>
