<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clientes - MiACaoMiGo</title>

  <link rel="stylesheet" href="../../CSS/PaginaSite.css">
  <link rel="stylesheet" href="../../CSS/css_rececao/rececionista.css">
  <link rel="stylesheet" href="../../CSS/css_admin/admin_dash.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body class="com-sidebar">

  <section class="sidebar">
    <a href="../../Pag_principal.html" class="logo">
      <img src="../../img/Logo_vet.png" alt="Logo">
    </a>

    <hr>

    <nav class="menu">
      <a href="admin_dashboard.html"><i class="fa fa-home"></i> Dashboard</a>

      <a href="clientes_admin.html" class="active"><i class="fa fa-users"></i> Clientes</a>
      <a href="funcionarios_admin.html"><i class="fa fa-user-tie"></i> Funcionários</a>
      <a href="faturacao_admin.html"><i class="fa fa-file-invoice-dollar"></i> Faturação</a>
      <a href="ferias_admin.html"><i class="fa fa-calendar-days"></i> Férias</a>
      <a href="marcacoes_admin.html"><i class="fa fa-calendar-check"></i> Marcações</a>
      <a href="resgates_admin.html"><i class="fa fa-paw"></i> Resgates</a>

      <hr>

      <a href="#" onclick="fazerLogout(event)"><i class="fa fa-sign-out"></i> Sair</a>  
      </a>
    </nav>
  </section>

  <header class="header-admin">
    <h1>Clientes</h1>
    <p>Gestão de clientes</p>
  </header>

  <main class="dashboard-main">

    <h2 class="titulo-seccao">Lista de Clientes</h2>

    <div class="container-botao-adicionar">
      <button 
    onclick="editarCliente('novo')"
    class="btn-salvar"
  >
    Adicionar Cliente
      </button>
    </div>

    <div class="tabela-container">

      <table class="tabela-consultas">

        <thead>
          <tr>
            <th>Nome</th>
            <th>Morada</th>
            <th>Email</th>
            <th>NIF</th>
            <th>Contacto</th>
            <th>Ações</th>
          </tr>
        </thead>

        <tbody id="tabelaClientes">
        </tbody>

      </table>

    </div>

  </main>

  <!-- MODAL VER CLIENTE -->
  <div id="modalCliente" class="modal">

    <div class="cartao-formulario">

      <button 
        class="fechar-modal"
        onclick="fecharModalVerCliente()"
      >
        &times;
      </button>

      <h2 class="titulo-modal-cliente">
        <i class="fa fa-user-circle"></i>
        Detalhes do Cliente
      </h2>

      <div class="grid-detalhes-cliente">

        <div class="campo-completo">
          <label>Nome Completo:</label>
          <input type="text" id="ver_nome" readonly class="input-leitura">
        </div>

        <div>
          <label>NIF:</label>
          <input type="text" id="ver_nif" readonly class="input-leitura">
        </div>

        <div>
          <label>Contacto:</label>
          <input type="text" id="ver_contacto" readonly class="input-leitura">
        </div>

        <div>
          <label>Email:</label>
          <input type="email" id="ver_email" readonly class="input-leitura">
        </div>

        <div>
          <label>Morada:</label>
          <input type="text" id="ver_morada" readonly class="input-leitura">
        </div>

      </div>

      <h3 class="titulo-animais">
        <i class="fa fa-paw"></i>
        Animais Associados
      </h3>

      <div id="listaAnimaisVisualizacao" class="lista-animais">
      </div>

      <div class="container-botao-voltar">

        <button 
          type="button"
          onclick="fecharModalVerCliente()"
          class="btn-cancelar"
        >
          Voltar
        </button>

      </div>

    </div>

  </div>

  <!-- MODAL EDITAR CLIENTE -->
  <div id="modalEdicao" class="modal">

    <div class="cartao-formulario">

      <button 
        class="fechar-modal"
        onclick="fecharModalEdicaoCliente()"
      >
        &times;
      </button>

      <h2 id="tituloEdicao" class="titulo-edicao">
        Editar Cliente
      </h2>

      <form onsubmit="event.preventDefault(); salvarEdicao();">

        <div class="grid-edicao">

          <div class="grupo-input">
            <label>Nome Completo:</label>
            <input type="text" id="editNome" class="input-premium" required>
          </div>

          <div class="grupo-input">
            <label>NIF:</label>
            <input type="text" id="editNif" class="input-premium" required>
          </div>

          <div class="grupo-input">
            <label>Email:</label>
            <input type="email" id="editEmail" class="input-premium">
          </div>

          <div class="grupo-input">
            <label>Contacto:</label>
            <input type="text" id="editContacto" class="input-premium" required>
          </div>

          <div class="grupo-input campo-completo">
            <label>Morada:</label>
            <input type="text" id="editMorada" class="input-premium">
          </div>

        </div>

        <div class="container-botoes-modal">

          <button 
            type="button"
            onclick="fecharModalEdicaoCliente()"
            class="btn-cancelar"
          >
            Cancelar
          </button>

          <button 
            type="submit"
            class="btn-salvar"
          >
            <i class="fa fa-save"></i> Guardar Alterações
          </button>

        </div>

      </form>

    </div>

  </div>

  <footer>
    <p style="color: white; font-size: 0.9rem;">
      Área Reservada - Clínica Miacãomigo © 2026
    </p>
  </footer>

  <script src="../../../JS/js_admin/clientes_admin.js"></script>
  <script src="../../../JS/js_logins/auth_logins.js"></script>

</body>
</html>
