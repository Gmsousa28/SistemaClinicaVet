<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico</title>

    <link rel="stylesheet" href="../../CSS/PaginaSite.css">
    <link rel="stylesheet" href="../../CSS/css_cliente/cliente.css">
    <link rel="stylesheet" href="../../CSS/css_cliente/historico.css">
    <link rel="stylesheet" href="../../CSS/css_cliente/header_cliente.css">
    <link rel="stylesheet" href="../../CSS/header_cliente.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

    <body class="com-sidebar">

        <section class="top-header">
            <h1>Painel de Histórico</h1>
        </section>

        <section class="sidebar">
            <a href="#" class="logo">
                <img src="../../img/Logo_vet.png">
            </a>

            <hr>

            <nav class="menu">
                <a href="dashboard_cliente.html"><i class="fa-solid fa-home"></i> Dashboard</a>
                <a href="perfil_cliente.html"><i class="fa-solid fa-user"></i> Perfil</a>
                <a href="consultas_cliente.html"><i class="fa-solid fa-calendar"></i> Consultas</a>
                <a href="historico_cliente.html" class="active"><i class="fa-solid fa-clock"></i> Histórico</a>
                <a href="adocao_cliente.html"><i class="fa fa-hand-holding-heart"></i> Adoções</a>

                <hr>

                <a href="#"><i class="fa-solid fa-right-from-bracket"></i> Sair</a>
            </nav>
        </section>

        <section class="dashboard">

            <h2>Histórico 📄</h2>

            <section class="filtros">
                <button class="ativo">Todos</button>
                <button>Últimos 7 dias</button>
                <button>Último mês</button>
            </section>

            <section class="lista-consultas">
                <p style="padding-left: 20px; color: #7f8c8d;">A carregar o seu histórico...</p>
            </section>

        </section>

        <div id="modal-detalhes-historico" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center;">
            <div class="modal-caixa" style="background: white; padding: 25px; border-radius: 10px; width: 90%; max-width: 400px; position: relative; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
                <button class="fechar-modal-historico" style="position: absolute; top: 15px; right: 15px; background: none; border: none; font-size: 20px; cursor: pointer; color: #7f8c8d;">&times;</button>
                <h2 style="margin-top: 0; color: #2c3e50; border-bottom: 2px solid #2ea89c; padding-bottom: 10px;">Detalhes do Registo</h2>
                <div class="detalhes-info" style="margin-top: 20px; line-height: 1.6; color: #34495e;">
                    <p id="detalhe-hist-nome" style="font-size: 1.1em; font-weight: bold;"></p>
                    <p id="detalhe-hist-data"></p>
                    <p id="detalhe-hist-motivo"></p>
                    <p id="detalhe-hist-medico"></p>
                    <p id="detalhe-hist-preco"></p>
                </div>
                <button class="btn btn-repetir-modal" style="width: 100%; margin-top: 20px; padding: 12px; background-color: #2ea89c; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: background 0.3s;">
                    Agendar Novamente
                </button>
            </div>
        </div>

        <script src="../../../JS/js_cliente/cliente_historico.js"></script>
    </body>
</html>
